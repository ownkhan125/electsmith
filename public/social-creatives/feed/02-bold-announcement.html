<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Feed 02 · Bold Announcement</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --plum: #744577; --plum-700: #482a4b; --plum-900: #1c1020; --cream-50: #fdfaeb; --cream-200: #f0e9b6; --sage: #accfa3; --mint: #84c5b1; --ink: #0e0712; }
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html,body { background:#ece9e4; min-height:100vh; }
  body { display:grid; place-items:center; padding:32px; font-family:'Inter Tight', system-ui, sans-serif; }
  .canvas {
    width:1080px; height:1080px; position:relative; overflow:hidden;
    background: radial-gradient(140% 90% at 80% 0%, #321e34 0%, #1c1020 60%, #0e0712 100%);
    color: var(--cream-50);
    border-radius:4px;
    transform: scale(min(1, calc((100vw - 64px) / 1080), calc((100vh - 64px) / 1080)));
    transform-origin:center;
    box-shadow:0 60px 120px -40px rgba(40,15,55,0.55);
  }
  .grid-bg { position:absolute; inset:0; opacity:.08; background-image:
    linear-gradient(to right, rgba(240,233,182,.6) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(240,233,182,.6) 1px, transparent 1px);
    background-size: 80px 80px; mask-image: radial-gradient(ellipse 80% 70% at 70% 30%, black 30%, transparent 100%); }
  .orb { position:absolute; top:-180px; right:-160px; width:600px; height:600px; border-radius:50%;
    background: radial-gradient(closest-side, rgba(132,197,177,.45), transparent 70%); filter: blur(10px); }
  .pill {
    position:absolute; top:80px; left:80px;
    display:inline-flex; align-items:center; gap:10px;
    padding:10px 18px; border-radius:999px;
    border:1px solid rgba(253,250,235,.25);
    background: rgba(28,16,32,.5); backdrop-filter: blur(8px);
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--cream-50);
  }
  .pill .dot { width:8px; height:8px; border-radius:50%; background: var(--mint); box-shadow: 0 0 0 4px rgba(132,197,177,.2); }
  .breaking { position:absolute; top:80px; right:80px;
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.32em; text-transform:uppercase;
    color: rgba(253,250,235,.55);
  }
  .display {
    position:absolute; top: 220px; left: 80px; right: 80px;
    font-family:'Fraunces',serif; font-weight:300; font-size: 168px; line-height:.95; letter-spacing:-0.045em;
    color: var(--cream-50);
  }
  .display em { font-style:italic; color: var(--mint); font-weight:300; }
  .body {
    position:absolute; bottom: 230px; left:80px; right:300px;
    font-size:22px; line-height:1.5; color: rgba(253,250,235,.7);
    max-width: 560px;
  }
  .body span { color: var(--cream-200); font-weight: 500; }
  /* date stamp */
  .stamp { position:absolute; bottom:230px; right:80px;
    text-align:right;
    border-left: 1px solid rgba(253,250,235,.15);
    padding-left: 28px;
  }
  .stamp .month { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.32em; text-transform:uppercase; color: rgba(253,250,235,.55); }
  .stamp .day { font-family:'Fraunces',serif; font-size:64px; line-height:1; color: var(--cream-50); margin-top:8px; }
  .stamp .year { font-family:'Fraunces',serif; font-style:italic; font-size:22px; color: var(--mint); margin-top:8px; }
  /* footer */
  .foot { position:absolute; bottom:80px; left:80px; right:80px;
    display:flex; align-items:flex-end; justify-content:space-between;
    border-top:1px solid rgba(253,250,235,.15); padding-top:24px;
  }
  .brand { font-family:'Fraunces',serif; font-size:22px; color: var(--cream-50); }
  .brand em { color: var(--mint); font-style:normal; }
  .handle { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.32em; color: rgba(253,250,235,.5); text-transform:uppercase; }
  .arrow-chip { display:inline-flex; align-items:center; gap:10px; padding:10px 16px; border-radius:999px; border:1px solid rgba(253,250,235,.3); color: var(--cream-50); font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.32em; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="grid-bg"></div>
    <div class="orb"></div>

    <div class="pill"><span class="dot"></span><span>New · Episode 02</span></div>
    <div class="breaking">@electsmith · vol. 01</div>

    <h1 class="display">Lorem<br>ipsum <em>dolor</em><br>sit amet.</h1>

    <p class="body"><span>Sed do eiusmod tempor</span> incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam quis nostrud.</p>

    <div class="stamp">
      <div class="month">June</div>
      <div class="day">11</div>
      <div class="year">2026</div>
    </div>

    <div class="foot">
      <span class="brand">Elect<em>Smith</em></span>
      <span class="arrow-chip">Tap to read →</span>
      <span class="handle">06 · 11 · 26</span>
    </div>
  </div>
</body>
</html>
