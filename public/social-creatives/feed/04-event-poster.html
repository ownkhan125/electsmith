<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Feed 04 · Event Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --plum:#744577; --plum-900:#1c1020; --cream-50:#fdfaeb; --cream-200:#f0e9b6; --mint:#84c5b1; --ink:#0e0712; }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:#ece9e4; min-height:100vh; }
  body { display:grid; place-items:center; padding:32px; font-family:'Inter Tight',system-ui,sans-serif; }
  .canvas { width:1080px; height:1080px; position:relative; overflow:hidden; background:var(--plum-900);
    transform:scale(min(1, calc((100vw - 64px)/1080), calc((100vh - 64px)/1080))); transform-origin:center;
    border-radius:4px; box-shadow:0 60px 120px -40px rgba(40,15,55,0.55); color: var(--cream-50); }
  .photo { position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(28,16,32,.2) 0%, rgba(28,16,32,.5) 50%, rgba(28,16,32,.95) 100%),
      url('https://images.unsplash.com/photo-1466611653911-95081537e5b7?w=1400&q=80') center/cover no-repeat; }
  .gradient-overlay { position:absolute; inset:0;
    background: linear-gradient(135deg, rgba(116,69,119,.55) 0%, transparent 50%, rgba(132,197,177,.25) 100%); }
  /* ticket-style border */
  .frame { position:absolute; inset:48px; border:1px solid rgba(253,250,235,.18); border-radius:8px; pointer-events:none; }
  .corner-tick { position:absolute; width:24px; height:24px; border:1px solid var(--cream-50); }
  .corner-tick.tl { top:36px; left:36px; border-right:none; border-bottom:none; }
  .corner-tick.tr { top:36px; right:36px; border-left:none; border-bottom:none; }
  .corner-tick.bl { bottom:36px; left:36px; border-right:none; border-top:none; }
  .corner-tick.br { bottom:36px; right:36px; border-left:none; border-top:none; }

  /* top header */
  .header { position:absolute; top:90px; left:90px; right:90px;
    display:flex; align-items:center; justify-content:space-between;
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.32em; text-transform:uppercase;
    color: rgba(253,250,235,.7);
  }
  .header .left { display:flex; align-items:center; gap:14px; }
  .header .dot { width:10px; height:10px; border-radius:50%; background:var(--mint); box-shadow:0 0 0 5px rgba(132,197,177,.2); animation: none; }

  /* date stack */
  .date-stack { position:absolute; top: 240px; left:90px; }
  .date-stack .month { font-family:'JetBrains Mono',monospace; font-size:14px; letter-spacing:.4em; text-transform:uppercase; color: var(--mint); }
  .date-stack .day { font-family:'Fraunces',serif; font-weight:300; font-size:280px; line-height:.85; letter-spacing:-0.04em; color: var(--cream-50); margin-top:10px; }
  .date-stack .year { font-family:'Fraunces',serif; font-style:italic; font-weight:300; font-size:48px; color: var(--cream-200); margin-top:8px; }

  /* event title */
  .title { position:absolute; bottom: 290px; left:90px; right:90px;
    font-family:'Fraunces',serif; font-weight:300; font-size: 84px; line-height:1.02; letter-spacing:-0.035em; color: var(--cream-50);
  }
  .title em { font-style:italic; color: var(--mint); }
  .subtitle { position:absolute; bottom: 240px; left:90px; right:90px;
    font-family:'JetBrains Mono',monospace; font-size:13px; letter-spacing:.35em; text-transform:uppercase; color: rgba(253,250,235,.7);
  }
  /* footer */
  .footer { position:absolute; bottom:90px; left:90px; right:90px;
    display:flex; align-items:center; justify-content:space-between; gap:24px;
    padding-top:22px; border-top:1px solid rgba(253,250,235,.18);
  }
  .footer .brand { font-family:'Fraunces',serif; font-size:24px; color: var(--cream-50); }
  .footer .brand em { color: var(--mint); font-style:normal; }
  .footer .rsvp { display:inline-flex; align-items:center; gap:10px; padding:12px 22px; border:1px solid var(--cream-50); border-radius:999px;
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.32em; text-transform:uppercase; color: var(--cream-50);
    background: rgba(253,250,235,.05); backdrop-filter: blur(6px); }
  .footer .handle { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.32em; text-transform:uppercase; color: rgba(253,250,235,.55); }
</style>
</head>
<body>
  <div class="canvas">
    <div class="photo"></div>
    <div class="gradient-overlay"></div>
    <div class="frame"></div>
    <span class="corner-tick tl"></span>
    <span class="corner-tick tr"></span>
    <span class="corner-tick bl"></span>
    <span class="corner-tick br"></span>

    <div class="header">
      <span class="left"><span class="dot"></span><span>Live · Save the date</span></span>
      <span>Vol. 04 / 10</span>
    </div>

    <div class="date-stack">
      <div class="month">Jun</div>
      <div class="day">22</div>
      <div class="year">— 2026</div>
    </div>

    <h2 class="title">Lorem ipsum<br><em>dolor</em> sit amet.</h2>
    <div class="subtitle">Consectetur · Adipiscing Elit · 10:00 AM</div>

    <div class="footer">
      <span class="brand">Elect<em>Smith</em></span>
      <span class="rsvp">Reserve a seat →</span>
      <span class="handle">@electsmith</span>
    </div>
  </div>
</body>
</html>
