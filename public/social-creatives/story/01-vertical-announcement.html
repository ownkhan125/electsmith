<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Story 01 · Vertical Announcement</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --plum:#744577; --plum-700:#482a4b; --plum-900:#1c1020; --cream-50:#fdfaeb; --cream-200:#f0e9b6; --mint:#84c5b1; --ink:#0e0712; --paper:#faf6e9; }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:#ece9e4; min-height:100vh; }
  body { display:grid; place-items:center; padding:24px; font-family:'Inter Tight',system-ui,sans-serif; }
  .canvas { width:1080px; height:1920px; position:relative; overflow:hidden;
    background: radial-gradient(120% 80% at 70% 20%, var(--plum-700) 0%, var(--plum-900) 65%, #0a0510 100%);
    color: var(--cream-50);
    transform: scale(min(1, calc((100vw - 48px)/1080), calc((100vh - 48px)/1920))); transform-origin: center;
    border-radius:6px; box-shadow:0 60px 120px -40px rgba(40,15,55,0.6);
  }
  .grid-bg { position:absolute; inset:0; opacity:.07;
    background-image:
      linear-gradient(to right, rgba(253,250,235,.5) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(253,250,235,.5) 1px, transparent 1px);
    background-size: 100px 100px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 30%, transparent 100%);
  }
  .orb { position:absolute; width: 800px; height:800px; border-radius:50%;
    background: radial-gradient(closest-side, rgba(132,197,177,.4), transparent 70%); filter: blur(20px); }
  .orb.a { top:-200px; right:-200px; }
  .orb.b { bottom:-300px; left:-150px; background: radial-gradient(closest-side, rgba(229,220,148,.18), transparent 70%); }

  /* Story safe-zones — visible padding 120/180 */
  .top-meta { position:absolute; top:160px; left:100px; right:100px;
    display:flex; align-items:center; justify-content:space-between;
    font-family:'JetBrains Mono',monospace; font-size:18px; letter-spacing:.36em; text-transform:uppercase; color: rgba(253,250,235,.7);
  }
  .top-meta .pill { display:inline-flex; gap:14px; align-items:center; padding:14px 24px; border-radius:999px;
    background: rgba(28,16,32,.55); border:1px solid rgba(253,250,235,.2); backdrop-filter: blur(8px);
  }
  .top-meta .pill .dot { width:12px; height:12px; border-radius:50%; background:var(--mint); }

  .display { position:absolute; top: 380px; left:100px; right:100px;
    font-family:'Fraunces',serif; font-weight:300; font-size: 220px; line-height:.95; letter-spacing:-0.045em;
    color: var(--cream-50);
  }
  .display em { font-style:italic; color: var(--mint); }
  .sub { position:absolute; top: 1180px; left:100px; right:200px;
    font-family:'Fraunces',serif; font-style:italic; font-weight:300; font-size: 48px; line-height:1.3; color: rgba(253,250,235,.8);
  }
  /* ornament */
  .ornament { position:absolute; top: 1080px; left:100px; display:flex; gap:14px; align-items:center; }
  .ornament .rule { width:80px; height:1px; background: var(--mint); }
  .ornament span { font-family:'JetBrains Mono',monospace; font-size:18px; letter-spacing:.36em; text-transform:uppercase; color: rgba(253,250,235,.7); }

  /* bottom CTA */
  .cta { position:absolute; bottom: 220px; left:100px; right:100px;
    display:flex; align-items:center; justify-content:space-between;
    padding: 36px 48px; border-radius: 999px;
    background: var(--cream-50); color: var(--ink);
    box-shadow: 0 40px 80px -30px rgba(0,0,0,.5);
  }
  .cta .label { font-family:'Fraunces',serif; font-size: 60px; }
  .cta .arrow { width:96px; height:96px; border-radius:50%; background: var(--plum); color: var(--cream-50);
    display:grid; place-items:center; font-family:'Fraunces',serif; font-size: 48px; }

  /* brand handle */
  .brand-row { position:absolute; bottom: 120px; left:100px; right:100px;
    display:flex; align-items:center; justify-content:space-between;
    font-family:'JetBrains Mono',monospace; font-size:18px; letter-spacing:.36em; text-transform:uppercase; color: rgba(253,250,235,.55);
  }
  .brand-row .brand { font-family:'Fraunces',serif; font-size:38px; letter-spacing:0; text-transform:none; color: var(--cream-50); }
  .brand-row .brand em { color: var(--mint); font-style:normal; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="grid-bg"></div>
    <div class="orb a"></div>
    <div class="orb b"></div>

    <div class="top-meta">
      <span class="pill"><span class="dot"></span><span>Live · Story 01</span></span>
      <span>06 · 11 · 26</span>
    </div>

    <h1 class="display">A new<br><em>chapter</em><br>begins.</h1>

    <div class="ornament"><span class="rule"></span><span>Volume 01 — Episode I</span></div>

    <p class="sub">Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod.</p>

    <a class="cta">
      <span class="label">Read the announcement</span>
      <span class="arrow">→</span>
    </a>

    <div class="brand-row">
      <span class="brand">Elect<em>Smith</em></span>
      <span>@electsmith</span>
    </div>
  </div>
</body>
</html>
