<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Story 08 · Endorsement</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --plum:#744577; --plum-700:#482a4b; --plum-900:#1c1020; --cream-50:#fdfaeb; --cream-200:#f0e9b6; --mint:#84c5b1; --ink:#0e0712; --paper:#faf6e9; }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:#ece9e4; min-height:100vh; }
  body { display:grid; place-items:center; padding:24px; font-family:'Inter Tight',system-ui,sans-serif; }
  .canvas { width:1080px; height:1920px; position:relative; overflow:hidden;
    background: var(--paper); color: var(--ink);
    transform: scale(min(1, calc((100vw - 48px)/1080), calc((100vh - 48px)/1920))); transform-origin: center;
    border-radius:6px; box-shadow:0 60px 120px -40px rgba(40,15,55,0.45);
  }
  /* upper headline area */
  .top { position:absolute; top:160px; left:100px; right:100px;
    display:flex; align-items:center; justify-content:space-between;
    font-family:'JetBrains Mono',monospace; font-size:18px; letter-spacing:.36em; text-transform:uppercase; color: var(--plum-700);
  }
  .top .left { display:flex; align-items:center; gap:18px; }
  .top .left .rule { width:60px; height:1px; background: var(--plum); opacity:.6; }
  /* seal */
  .seal { position:absolute; top: 140px; left: 50%; transform: translateX(-50%);
    width: 200px; height: 200px; border-radius:50%; border: 2px solid var(--plum);
    display:none; }

  .headline { position:absolute; top: 280px; left:100px; right:100px;
    font-family:'Fraunces',serif; font-weight:300; font-size: 140px; line-height:.95; letter-spacing:-0.04em; color: var(--ink);
  }
  .headline em { font-style:italic; color: var(--plum); }

  /* photo card */
  .photo-card { position:absolute; top: 760px; left:100px; right:100px; height: 560px;
    border-radius: 28px; overflow:hidden;
    background:
      linear-gradient(180deg, rgba(28,16,32,0) 35%, rgba(28,16,32,.8) 100%),
      url('https://images.unsplash.com/photo-1573497019418-b400bb3ab074?w=1100&q=80') center/cover no-repeat;
    box-shadow: 0 50px 100px -40px rgba(40,15,55,.45);
    color: var(--cream-50);
  }
  .photo-card .tag {
    position:absolute; top:24px; left:24px;
    display:inline-flex; gap:10px; align-items:center; padding:10px 18px; border-radius:999px;
    background: rgba(28,16,32,.55); border:1px solid rgba(253,250,235,.3); backdrop-filter: blur(8px);
    font-family:'JetBrains Mono',monospace; font-size:14px; letter-spacing:.32em; text-transform:uppercase;
  }
  .photo-card .tag .dot { width:10px; height:10px; border-radius:50%; background: var(--mint); }

  .photo-card .meta { position:absolute; bottom: 36px; left: 36px; right: 36px;
    display:flex; align-items:flex-end; justify-content:space-between; gap: 20px;
  }
  .photo-card .meta .name { font-family:'Fraunces',serif; font-size: 56px; line-height:1; color: var(--cream-50); }
  .photo-card .meta .role { font-family:'JetBrains Mono',monospace; font-size:14px; letter-spacing:.32em; text-transform:uppercase; color: rgba(253,250,235,.75); margin-top: 10px; }
  .photo-card .org-stamp { padding: 12px 18px; border:1px solid rgba(253,250,235,.4); border-radius:999px;
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.32em; text-transform:uppercase; color: var(--cream-50);
  }

  /* quote strip */
  .quote-strip { position:absolute; top: 1380px; left:100px; right:100px;
    border-top: 1px solid rgba(40,15,55,.15);
    padding-top: 36px;
    font-family:'Fraunces',serif; font-style:italic; font-weight:300; font-size: 56px; line-height:1.2; color: var(--plum-700);
  }
  .quote-strip em { color: var(--plum); font-style:italic; }

  /* footer */
  .brand-row { position:absolute; bottom: 130px; left:100px; right:100px;
    display:flex; align-items:center; justify-content:space-between;
    font-family:'JetBrains Mono',monospace; font-size:18px; letter-spacing:.36em; text-transform:uppercase; color: rgba(14,7,18,.55);
  }
  .brand-row .brand { font-family:'Fraunces',serif; font-size:34px; letter-spacing:0; text-transform:none; color: var(--ink); }
  .brand-row .brand em { color: var(--plum); font-style:normal; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="top">
      <span class="left"><span class="rule"></span><span>Endorsement · 08</span></span>
      <span>06 · 11 · 26</span>
    </div>

    <h1 class="headline">Backed by<br><em>Lorem Ipsum</em></h1>

    <div class="photo-card">
      <span class="tag"><span class="dot"></span><span>Endorsed</span></span>
      <div class="meta">
        <div>
          <div class="name">Lorem Ipsum</div>
          <div class="role">Consectetur · Adipiscing Elit</div>
        </div>
        <span class="org-stamp">— Org of Lorem</span>
      </div>
    </div>

    <p class="quote-strip">"Sed do eiusmod tempor incididunt ut <em>labore</em> et dolore magna aliqua — quis nostrud."</p>

    <div class="brand-row">
      <span class="brand">Elect<em>Smith</em></span>
      <span>@electsmith</span>
    </div>
  </div>
</body>
</html>
