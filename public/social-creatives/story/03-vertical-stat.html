<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Story 03 · Vertical Stat</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --plum:#744577; --plum-700:#482a4b; --plum-900:#1c1020; --cream-50:#fdfaeb; --cream-200:#f0e9b6; --mint:#84c5b1; --sage:#accfa3; --ink:#0e0712; --paper:#faf6e9; }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:#ece9e4; min-height:100vh; }
  body { display:grid; place-items:center; padding:24px; font-family:'Inter Tight',system-ui,sans-serif; }
  .canvas { width:1080px; height:1920px; position:relative; overflow:hidden;
    background: var(--paper);
    transform: scale(min(1, calc((100vw - 48px)/1080), calc((100vh - 48px)/1920))); transform-origin: center;
    border-radius:6px; box-shadow:0 60px 120px -40px rgba(40,15,55,0.5);
  }
  /* color split */
  .top-band { position:absolute; top:0; left:0; right:0; height: 60%; background: var(--paper); }
  .bottom-band { position:absolute; bottom:0; left:0; right:0; height: 40%; background: var(--plum-900); }
  .grain { position:absolute; inset:0;
    background-image: radial-gradient(circle at 1px 1px, rgba(40,15,55,0.06) 1px, transparent 0);
    background-size: 4px 4px; opacity:.45; mix-blend-mode:multiply; pointer-events:none; }
  .wash { position:absolute; top:0; left:0; right:0; height: 60%;
    background: radial-gradient(60% 60% at 80% 0%, rgba(132,197,177,.4), transparent 70%);
    pointer-events:none;
  }

  .top-meta { position:absolute; top:160px; left:100px; right:100px;
    display:flex; align-items:center; justify-content:space-between;
    font-family:'JetBrains Mono',monospace; font-size:18px; letter-spacing:.36em; text-transform:uppercase; color: var(--plum-700);
  }
  .top-meta .left { display:flex; align-items:center; gap:24px; }
  .top-meta .left .rule { width: 80px; height: 1px; background: var(--plum); opacity:.6; }

  /* mega stat */
  .stat-wrap { position:absolute; top: 350px; left:100px; right:100px; text-align:center; }
  .stat-wrap .label { font-family:'JetBrains Mono',monospace; font-size:20px; letter-spacing:.5em; text-transform:uppercase; color: var(--plum); }
  .stat-wrap .number { margin-top: 30px; font-family:'Fraunces',serif; font-weight:300; font-style:italic; font-size: 800px; line-height:.86; color: var(--plum); letter-spacing:-0.05em; }
  .stat-wrap .number .pct { font-style:italic; font-size: 360px; vertical-align: super; color: var(--plum-700); }

  /* below-line caption */
  .caption { position:absolute; top: 1180px; left:100px; right:100px; text-align:center;
    font-family:'Fraunces',serif; font-style:italic; font-weight:300; font-size: 64px; line-height:1.2; color: var(--ink);
  }

  /* bottom dark explainer */
  .explain { position:absolute; bottom: 280px; left:100px; right:100px;
    color: var(--cream-50);
  }
  .explain .label { font-family:'JetBrains Mono',monospace; font-size:18px; letter-spacing:.4em; text-transform:uppercase; color: var(--mint); }
  .explain .body { margin-top:18px; font-family:'Fraunces',serif; font-style:italic; font-weight:300; font-size: 56px; line-height:1.25; color: var(--cream-200); }

  .brand-row { position:absolute; bottom: 120px; left:100px; right:100px;
    display:flex; align-items:center; justify-content:space-between;
    font-family:'JetBrains Mono',monospace; font-size:18px; letter-spacing:.36em; text-transform:uppercase; color: rgba(253,250,235,.55);
  }
  .brand-row .brand { font-family:'Fraunces',serif; font-size:34px; letter-spacing:0; text-transform:none; color: var(--cream-50); }
  .brand-row .brand em { color: var(--mint); font-style:normal; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="top-band"></div>
    <div class="bottom-band"></div>
    <div class="wash"></div>
    <div class="grain"></div>

    <div class="top-meta">
      <span class="left"><span class="rule"></span><span>Statistic · Story 03</span></span>
      <span>06 · 11 · 26</span>
    </div>

    <div class="stat-wrap">
      <div class="label">Lorem ipsum</div>
      <div class="number">8<span class="pct">x</span></div>
    </div>

    <p class="caption">Of lorem <span style="color:var(--plum)">ipsum dolor</span> sit amet.</p>

    <div class="explain">
      <div class="label">— Source · Lorem 2026</div>
      <div class="body">Consectetur adipiscing elit, sed do eiusmod tempor incididunt.</div>
    </div>

    <div class="brand-row">
      <span class="brand">Elect<em>Smith</em></span>
      <span>@electsmith</span>
    </div>
  </div>
</body>
</html>
