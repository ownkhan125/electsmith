<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Story 07 · Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --plum:#744577; --plum-700:#482a4b; --plum-800:#321e34; --plum-900:#1c1020; --cream-50:#fdfaeb; --cream-200:#f0e9b6; --mint:#84c5b1; --ink:#0e0712; }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:#ece9e4; min-height:100vh; }
  body { display:grid; place-items:center; padding:24px; font-family:'Inter Tight',system-ui,sans-serif; }
  .canvas { width:1080px; height:1920px; position:relative; overflow:hidden;
    background: linear-gradient(180deg, var(--plum) 0%, var(--plum-700) 40%, var(--plum-900) 100%);
    color: var(--cream-50);
    transform: scale(min(1, calc((100vw - 48px)/1080), calc((100vh - 48px)/1920))); transform-origin: center;
    border-radius:6px; box-shadow:0 60px 120px -40px rgba(40,15,55,0.55);
  }
  .grid-bg { position:absolute; inset:0; opacity:.07;
    background-image:
      linear-gradient(to right, rgba(253,250,235,.5) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(253,250,235,.5) 1px, transparent 1px);
    background-size: 120px 120px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 100%); }
  .orb { position:absolute; width: 700px; height: 700px; border-radius:50%; filter: blur(20px); }
  .orb.a { top:-200px; left:-200px; background: radial-gradient(closest-side, rgba(132,197,177,.35), transparent 70%); }
  .orb.b { bottom:-250px; right:-200px; background: radial-gradient(closest-side, rgba(229,220,148,.22), transparent 70%); }

  .top { position:absolute; top:160px; left:100px; right:100px;
    display:flex; align-items:center; justify-content:space-between; color: rgba(253,250,235,.7);
    font-family:'JetBrains Mono',monospace; font-size:18px; letter-spacing:.36em; text-transform:uppercase;
  }
  .top .pill { display:inline-flex; gap:14px; align-items:center; padding:14px 24px; border-radius:999px;
    background: rgba(28,16,32,.45); border:1px solid rgba(253,250,235,.25); backdrop-filter: blur(8px); }
  .top .pill .dot { width:12px; height:12px; border-radius:50%; background:var(--mint); }

  /* T-minus label */
  .tminus { position:absolute; top: 540px; left:100px; right:100px; text-align:center;
    font-family:'JetBrains Mono',monospace; font-size: 32px; letter-spacing:.5em; text-transform:uppercase; color: var(--mint);
  }

  /* big number */
  .num { position:absolute; top: 620px; left:0; right:0; text-align:center;
    font-family:'Fraunces',serif; font-weight:300; font-size: 760px; line-height:.85; letter-spacing:-0.06em; color: var(--cream-50);
  }
  .num small { display:inline-block; font-family:'Fraunces',serif; font-style:italic; font-weight:300; font-size: 140px; vertical-align: super; color: var(--mint); margin-left: 8px; }

  /* days label below */
  .days-label { position:absolute; top: 1240px; left:0; right:0; text-align:center;
    font-family:'Fraunces',serif; font-style:italic; font-weight:300; font-size: 84px; line-height:1; color: var(--cream-200); letter-spacing:-0.01em;
  }

  /* event line */
  .event-line { position:absolute; bottom: 380px; left:100px; right:100px; text-align:center;
    padding: 32px 0; border-top: 1px solid rgba(253,250,235,.2); border-bottom: 1px solid rgba(253,250,235,.2);
    font-family:'Fraunces',serif; font-weight:300; font-size: 64px; color: var(--cream-50); letter-spacing:-0.02em;
  }
  .event-line em { font-style:italic; color: var(--mint); }
  .event-line .meta { display:block; margin-top: 14px; font-family:'JetBrains Mono',monospace; font-size:18px; letter-spacing:.4em; text-transform:uppercase; color: rgba(253,250,235,.65); }

  /* CTA */
  .cta { position:absolute; bottom: 220px; left:100px; right:100px;
    display:flex; align-items:center; justify-content:center; gap: 20px;
    padding: 36px 48px; border-radius:999px;
    background: var(--cream-50); color: var(--ink);
    box-shadow: 0 40px 80px -30px rgba(0,0,0,.6);
    font-family:'Fraunces',serif; font-style:italic; font-size: 56px;
  }
  .cta .arrow { width:80px; height:80px; border-radius:50%; background: var(--plum); color: var(--cream-50);
    display:grid; place-items:center; font-size: 40px; font-style:normal; }

  .brand-row { position:absolute; bottom: 120px; left:100px; right:100px;
    display:flex; align-items:center; justify-content:space-between;
    font-family:'JetBrains Mono',monospace; font-size:18px; letter-spacing:.36em; text-transform:uppercase; color: rgba(253,250,235,.55);
  }
  .brand-row .brand { font-family:'Fraunces',serif; font-size:32px; letter-spacing:0; text-transform:none; color: var(--cream-50); }
  .brand-row .brand em { color: var(--mint); font-style:normal; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="grid-bg"></div>
    <div class="orb a"></div>
    <div class="orb b"></div>

    <div class="top">
      <span class="pill"><span class="dot"></span><span>Countdown · Story 07</span></span>
      <span>06 · 11 · 26</span>
    </div>

    <div class="tminus">— T-minus —</div>
    <div class="num">07<small>days</small></div>

    <p class="days-label">until lorem ipsum.</p>

    <div class="event-line">
      <em>Lorem ipsum,</em> dolor sit amet.
      <span class="meta">Sat · Jun 22 · 10 AM</span>
    </div>

    <a class="cta"><span>Reserve a seat</span><span class="arrow">→</span></a>

    <div class="brand-row">
      <span class="brand">Elect<em>Smith</em></span>
      <span>@electsmith</span>
    </div>
  </div>
</body>
</html>
